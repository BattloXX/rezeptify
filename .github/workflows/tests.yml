name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from app
      - name: Show app logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs app
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for f in static/js/*.js static/js/views/*.js static/sw.js; do node --check "$f"; done
